; Omega Valley UE5 trial. Rendering defaults for the barn dusk slice:
; Lumen GI + reflections, Virtual Shadow Maps, Nanite, sRGB output through the ACES filmic tonemapper,
; exposure: histogram auto exposure clamped in the level's PostProcessVolume (EV100 range in build_barn_level.py).
; Player: the engine's First Person template (install_fp_template.ps1), WASD + mouse look.

[/Script/EngineSettings.GameMapsSettings]
EditorStartupMap=/Game/OmegaValley/Maps/BarnSlice.BarnSlice
GameDefaultMap=/Game/OmegaValley/Maps/BarnSlice.BarnSlice
GlobalDefaultGameMode=/Game/FirstPerson/Blueprints/BP_FirstPersonGameMode.BP_FirstPersonGameMode_C

[/Script/Engine.RendererSettings]
; Global illumination and reflections: 1 = Lumen
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Lumen.TraceMeshSDFs=1
r.GenerateMeshDistanceFields=True
; Software Lumen: runs on any DX12 SM6 GPU. Set both to True to try hardware ray tracing on an RTX/RDNA2+ card.
r.Lumen.HardwareRayTracing=False
r.RayTracing=False
; Shadows: Virtual Shadow Maps
r.Shadow.Virtual.Enable=1
; Nanite
r.Nanite.ProjectEnabled=True
; Fully dynamic lighting (no lightmaps to bake)
r.AllowStaticLighting=False
; Sky and fog
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
; Exposure: manual, no eye adaptation
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Method=2
r.DefaultFeature.AutoExposure.Bias=0.0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
; Tonemapping: ACES filmic tonemapper to an sRGB / Rec.709 display
r.TonemapperFilm=1
r.HDR.EnableHDROutput=0
r.HDR.Display.OutputDevice=0
r.HDR.Display.ColorGamut=0
; Anti-aliasing: 4 = TSR
r.AntiAliasingMethod=4
r.CustomDepth=1
r.SkinCache.CompileShaders=True
r.VirtualTextures=True

[/Script/Engine.Engine]
; Working colour space stays sRGB / Rec.709 (engine default); listed here so it is explicit.
bUseFixedFrameRate=False
bSmoothFrameRate=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
